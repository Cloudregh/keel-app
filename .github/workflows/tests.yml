# Keel: the suites that must run on every pull request (docs/test-report.md, "CI").
# Not active yet: the repository has no CI. To turn it on, copy this file to .github/workflows/tests.yml and push.
# No paid AI calls: the coach is mocked in every test, and the evals re-grade stored runs ($0).
name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements-dev.lock }
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.lock
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint, format and type check
        run: npm run lint
      - name: Dependency audit
        run: npm run audit
      - name: Tracker tests (Python, coverage ≥ 85%)
        run: npm run test:py
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Logic, ML, AI-safety and security tests (coverage ≥ 80%)
        run: npm run test:js
      - name: End-to-end, Chromium, Firefox and WebKit
        run: npm run test:e2e
      - name: Model eval (planner) and the shipped coach runs
        run: |
          node eval/planner/run.mjs
          node eval/coach/run.mjs eval/results/coach-run-20261114122555.json
          node eval/coach/attack.mjs eval/results/coach-attack-run-20261114121818.json
          node eval/data/build.mjs --check
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: test-results, path: "test-results/\nplaywright-report/", retention-days: 7 }
