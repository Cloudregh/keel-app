# Keel: the suites that must run on every pull request (docs/test-report.md, "CI").
# Live copy: .github/workflows/tests.yml (first run passed on d349215). Keep the two files identical.
# Actions are on majors that run on Node.js 24 (checkout v6, setup-node v6, setup-python v6, upload-artifact v6).
# No paid AI calls: the coach is mocked in every test, and the evals re-grade stored runs ($0).
name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements-dev.lock }
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.lock
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint, format and type check
        run: npm run lint
      - name: Dependency audit
        run: npm run audit
      - name: Tracker tests (Python, coverage ≥ 85%)
        run: npm run test:py
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Logic, ML, AI-safety and security tests (coverage ≥ 80%)
        run: npm run test:js
      - name: End-to-end, Chromium, Firefox and WebKit
        run: npm run test:e2e
      - name: Evals (planner + the shipped coach runs decide the exit code; history is printed) and datasets
        run: |
          npm run eval
          node eval/data/build.mjs --check
      - if: failure()
        uses: actions/upload-artifact@v6
        with: { name: test-results, path: "test-results/\nplaywright-report/", retention-days: 7 }
