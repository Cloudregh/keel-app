[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP"]
ignore = ["S603", "S607"]  # tracker intentionally runs fixed macOS tools (lsappinfo, ioreg, osascript, launchctl) with list args

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
files = ["tracker/keel_tracker.py", "tracker/app_main.py"]
python_version = "3.9"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/py"]
addopts = "-q"
