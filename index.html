<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keel — focus & time tracker</title>
<script>
/* Content-Security-Policy (bug 32). The page can only talk to itself, the local tracker and Google Fonts, so even
   if a script were ever injected it couldn't send data to another site. Added from here because GitHub Pages can't
   send security headers; skipped inside claude.ai, which runs artifacts under its own policy. */
if (!/claude\.ai$|claudeusercontent\.com$|claude\.site$/.test(location.hostname)) {
  const m = document.createElement("meta");
  m.httpEquiv = "Content-Security-Policy";
  m.content = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:47821 http://localhost:47821; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'";
  document.head.appendChild(m);
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Raleway:wght@600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#09090b">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  color-scheme:light;
  --bg:#eaeef4; --panel:#ffffff; --panel-2:#f4f6fa; --line:#dce2eb; --line-2:#c9d1dd;
  --ink:#162033; --ink-2:#47536b; --ink-3:#6f7a90;
  --accent:#2f54e0; --accent-ink:#ffffff; --accent-soft:#e3e9fd;
  --break:#5c7d96; --unassigned:#8b95a8;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --good-ink:#006300; --crit-ink:#b42626;
  --shadow:0 1px 0 rgba(22,32,51,.04), 0 8px 24px -16px rgba(22,32,51,.25);
  --radius-l:18px; --radius-m:12px; --radius-s:8px;
  --f-ui:"Manrope",system-ui,sans-serif; --f-disp:"Bricolage Grotesque","Manrope",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f131b; --panel:#171c26; --panel-2:#1d2330; --line:#272f3e; --line-2:#364052;
  --ink:#eef1f6; --ink-2:#b8c0cf; --ink-3:#8590a4;
  --accent:#6f8cff; --accent-ink:#0b1020; --accent-soft:#222c4a;
  --break:#7e9cb3; --unassigned:#6f7a8e;
  --good-ink:#4fd04f; --crit-ink:#ff8080;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 30px -18px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f-ui);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;margin:0;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.15}
h2{font-size:18px}
h3{font-size:15px}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 16px;border-right:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand svg{flex:none}
.brand b{font-family:var(--f-disp);font-size:21px;letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:9px 10px;border-radius:10px;color:var(--ink-2);font-weight:600;text-align:left}
.nav button:hover{background:var(--panel-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .kbd{margin-left:auto;font-size:11px;color:var(--ink-3);font-weight:500}
.tracker{margin-top:auto;border:1px solid var(--line);border-radius:var(--radius-m);padding:14px;background:var(--panel-2)}
.tracker .t-label{font-size:12px;color:var(--ink-3);font-weight:600}
.tracker .t-time{font-family:var(--f-disp);font-size:30px;font-weight:700;line-height:1.1;margin:2px 0 4px}
.tracker .t-what{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tracker .row{display:flex;gap:6px;margin-top:10px}
.sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;padding:0 8px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync[data-s="synced"] i{background:var(--good)}
.sync[data-s="syncing"] i{background:var(--warn)}
.main{min-width:0;padding:28px 36px 80px;max-width:1240px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head p{margin:4px 0 0;color:var(--ink-3)}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--panel);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--panel-2)}
.btn.danger{color:var(--crit-ink)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.lg{padding:12px 22px;font-size:15.5px;border-radius:12px}
.btn svg{width:16px;height:16px}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--ink-3)}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-2);background:var(--panel);border-radius:9px;padding:8px 10px;font-weight:500;font-size:14px;color:var(--ink)}
textarea.input{resize:vertical;min-height:70px}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--ink-2);color:var(--ink);background:var(--panel-2)}
.dot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.hatch{background:repeating-linear-gradient(135deg,var(--break) 0 2px,transparent 2px 5px)!important}

/* Surfaces */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-l);padding:20px;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.grid{display:grid;gap:18px}
.g-today{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:18px}

/* Today */
.daystrip{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.goal{position:relative;width:168px;height:168px}
.goal .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.goal .c b{font-family:var(--f-disp);font-size:32px;line-height:1}
.goal .c span{font-size:12px;color:var(--ink-3);display:block;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 22px}
.stat .v{font-family:var(--f-disp);font-size:26px;font-weight:700;line-height:1.1}
.stat .l{font-size:13px;color:var(--ink-3);font-weight:600}
.stat .s{font-size:12px;color:var(--ink-3)}
.score-bar{height:6px;border-radius:3px;background:var(--panel-2);margin-top:6px;overflow:hidden}
.score-bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--line-2);border-left:4px solid var(--warn);background:var(--panel);border-radius:12px;padding:12px 16px;margin-bottom:18px}
.banner p{margin:0;flex:1;min-width:200px}

/* Timeline chart */
.tl{position:relative;margin-top:6px}
.tl-track{position:relative;height:44px;background:var(--panel-2);border-radius:8px}
.tl-seg{position:absolute;top:6px;bottom:6px;border-radius:4px;min-width:3px;box-shadow:0 0 0 1px var(--panel)}
.tl-seg:hover{filter:brightness(1.1);top:3px;bottom:3px}
.tl-axis{position:relative;height:20px;margin-top:4px}
.tl-axis span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--ink-3)}
.tl-now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:13.5px}
.hbar .n{display:flex;align-items:center;gap:7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.hbar .b{height:12px;background:var(--panel-2);border-radius:4px}
.hbar .b i{display:block;height:100%;border-radius:4px}
.hbar .v{text-align:right;color:var(--ink-2)}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12.5px;line-height:1.4;max-width:260px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
.tip b{font-weight:700}

/* Tasks */
.qa{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.qa input{flex:1;border:0;background:none;padding:8px 0;font-size:15px;outline:none;min-width:0}
.qa-hint{font-size:12.5px;color:var(--ink-3);margin:8px 2px 0;min-height:20px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qa-hint code{font-family:var(--f-ui);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-weight:600;color:var(--ink-2)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 12px}
.tasks{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-l);overflow:hidden;box-shadow:var(--shadow)}
.group-h{padding:10px 16px 6px;font-size:12.5px;font-weight:700;color:var(--ink-3);background:var(--panel-2);border-bottom:1px solid var(--line)}
.task{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task:hover{background:var(--panel-2)}
.task.active-t{box-shadow:inset 3px 0 0 var(--accent)}
.check{width:20px;height:20px;border-radius:6px;border:2px solid var(--line-2);background:none;display:grid;place-items:center;padding:0}
.check:hover{border-color:var(--accent)}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:13px;height:13px}
.task .t{min-width:0}
.task .tt{font-weight:600;overflow-wrap:anywhere}
.task.done .tt{text-decoration:line-through;color:var(--ink-3)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink-3);margin-top:2px;align-items:center}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta .over{color:var(--crit-ink);font-weight:600}
.meta svg{width:13px;height:13px}
.prio-3{color:var(--crit-ink)!important;font-weight:700}
.prio-2{color:#b57900!important;font-weight:700}
:root[data-theme="dark"] .prio-2{color:var(--warn)!important}
.t-actions{display:flex;gap:2px;align-items:center}
.play{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--panel);display:grid;place-items:center;color:var(--ink-2)}
.play:hover{border-color:var(--accent);color:var(--accent)}
.play.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.play svg{width:14px;height:14px}
.editor{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:12px 0 6px}
.editor .wide{grid-column:1/-1}
.subtasks{display:flex;flex-direction:column;gap:6px}
.subtask{display:flex;gap:8px;align-items:center;font-size:13.5px}
.subtask .check{width:17px;height:17px;border-radius:5px}
.subtask.done span{text-decoration:line-through;color:var(--ink-3)}
.sub-prog{font-size:12px}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* Focus */
.focus-wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
.focus-stage{display:flex;flex-direction:column;align-items:center;padding:30px 20px 34px}
.ring{position:relative;width:min(380px,80vw);aspect-ratio:1}
.ring svg{width:100%;height:100%;display:block}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px}
.ring .clock{font-family:var(--f-disp);font-weight:700;font-size:clamp(46px,9vw,76px);line-height:1;letter-spacing:-.03em}
.ring .lbl{font-size:13.5px;color:var(--ink-3);font-weight:600;margin-bottom:8px}
.ring .sub{font-size:14px;color:var(--ink-2);margin-top:10px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring .arc{transition:stroke-dashoffset .9s linear}
.controls{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;justify-content:center}
.pomodots{display:flex;gap:7px;margin-top:18px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.pomodots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line-2)}
.pomodots i.f{background:var(--accent);border-color:var(--accent)}
.durs{display:flex;gap:6px;flex-wrap:wrap}
.session-list{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.srow:last-child{border-bottom:0}
.srow .bar{height:28px;border-radius:2px}
.srow .w{min-width:0}
.srow .w div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .w small{color:var(--ink-3);font-size:12px}
.srow .d{font-weight:600}

/* Timeline view */
.daynav{display:flex;align-items:center;gap:6px}
.entries .srow{grid-template-columns:4px 110px 1fr auto auto;padding:11px 0}
.entries .time{color:var(--ink-2);font-size:13px}

/* Reports */
.cols{display:flex;align-items:flex-end;gap:6px;height:240px;position:relative;padding-left:56px}
.cols .gridl{position:absolute;left:56px;right:0;border-top:1px dashed var(--line);font-size:11px;color:var(--ink-3)}
.cols .gridl span{position:absolute;left:-56px;top:-8px;width:50px;text-align:right;white-space:nowrap}
.col{flex:1;display:flex;flex-direction:column-reverse;gap:2px;height:100%;justify-content:flex-start;position:relative;z-index:1;min-width:0}
.col i{display:block;width:100%;border-radius:2px}
.col i:first-child{border-radius:0 0 2px 2px}
.col i:last-child{border-top-left-radius:4px;border-top-right-radius:4px}
.col i:hover{filter:brightness(1.12)}
.xlab{display:flex;gap:6px;padding-left:56px;margin-top:6px}
.xlab span{flex:1;text-align:center;font-size:11.5px;color:var(--ink-3);min-width:0;overflow:hidden;white-space:nowrap}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:700;font-size:12.5px;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}

/* Projects */
.prow{display:grid;grid-template-columns:auto 1fr 110px 110px 90px auto;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .input{max-width:320px}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:6px;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--panel)}
.colorbtn{width:26px;height:26px;border-radius:7px;border:0;padding:0}

/* Settings */
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.set-row{display:grid;grid-template-columns:1fr 140px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row label{font-weight:600}
.set-row small{display:block;color:var(--ink-3);font-weight:500;font-size:12.5px}
.toggle{position:relative;width:42px;height:24px;border-radius:12px;background:var(--line-2);border:0;justify-self:end;padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle[aria-checked="true"]::after{transform:translateX(18px)}

/* Modal & toast */
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.45);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:var(--panel);border-radius:18px;width:min(520px,100%);padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:90vh;overflow:auto}
.modal h2{margin-bottom:6px}
.modal p{color:var(--ink-2);margin:0 0 16px}
.modal .form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .form .wide{grid-column:1/-1}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:70}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:11px;font-weight:600;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:tin .2s ease-out;max-width:340px}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.ai-out{white-space:pre-wrap;font-size:14px;color:var(--ink-2);line-height:1.6;overflow-wrap:anywhere}
.ai-label{display:flex;align-items:center;gap:5px;margin:8px 0 0;font-size:12px;color:var(--ink-3)}.ai-label svg{width:12px;height:12px}
.kb{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.kb kbd{font-family:var(--f-ui);font-weight:700;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;padding:1px 8px;background:var(--panel-2);text-align:center}

.tl-lab{font-size:12px;color:var(--ink-3);font-weight:600;margin:10px 0 5px}
.tl-lab:first-child{margin-top:0}
.legend.cats{margin-top:6px}
.hbar.wide-n{grid-template-columns:170px 1fr 64px}
.hbar .n small{display:block;font-weight:500;color:var(--ink-3);font-size:11.5px;line-height:1.2}
.hbar .n span{overflow:hidden;text-overflow:ellipsis}
.kpis.five{grid-template-columns:repeat(5,1fr)}
.stats.mini .v{font-size:21px;white-space:nowrap}
.apps-tbl td{vertical-align:middle}
.apps-tbl .an{display:flex;gap:9px;align-items:center;min-width:0}
.apps-tbl .an>div{min-width:0}
.apps-tbl .an b{display:block;font-weight:600;overflow-wrap:anywhere}

/* ===== Rize-inspired theme: zinc surfaces, violet accent, pill controls ===== */
:root{
  color-scheme:light;
  --f-ui:"Inter",system-ui,-apple-system,sans-serif; --f-disp:"Raleway","Inter",system-ui,sans-serif;
  --bg:#f4f4f5; --side:#fafafa; --panel:#ffffff; --panel-2:#f4f4f5; --panel-3:#e4e4e7; --line:#e4e4e7; --line-2:#d4d4d8;
  --ink:#09090b; --ink-2:#52525b; --ink-3:#62626b;
  --accent:#7c3aed; --accent-2:#8b5cf6; --accent-ink:#ffffff; --accent-soft:rgba(124,58,237,.10);
  --cta:#18181b; --cta-ink:#fafafa; --nav-on:#e4e4e7; --seg-on:#ffffff;
  --break:#a1a1aa; --unassigned:#a1a1aa; --good:#16a34a; --good-ink:#15803d; --warn:#d97706; --crit:#dc2626; --crit-ink:#b91c1c;
  --glow:radial-gradient(60% 50% at 70% 0%,rgba(139,92,246,.10),transparent 70%);
  --shadow:none;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#09090b; --side:#0c0c0e; --panel:#111113; --panel-2:#18181b; --panel-3:#27272a; --line:#1f1f23; --line-2:#2e2e33;
  --ink:#fafafa; --ink-2:#a1a1aa; --ink-3:#8e8e97;
  --accent:#a78bfa; --accent-2:#8b5cf6; --accent-ink:#0b0b0f; --accent-soft:rgba(139,92,246,.16);
  --cta:#fafafa; --cta-ink:#09090b; --nav-on:#1c1c20; --seg-on:#27272a;
  --break:#52525b; --unassigned:#52525b; --good:#4ade80; --good-ink:#4ade80; --warn:#fbbf24; --crit:#f87171; --crit-ink:#f87171;
  --glow:radial-gradient(55% 45% at 75% -5%,rgba(139,92,246,.22),transparent 70%);
}
body{font-size:14px;background:var(--bg) var(--glow) no-repeat;background-attachment:fixed;letter-spacing:-.003em}
h1,h2,h3{font-family:var(--f-disp);letter-spacing:-.01em}
h1{font-size:24px;font-weight:700}
h2{font-size:15px;font-weight:700}
.side{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;gap:14px;overflow-y:auto;overscroll-behavior:contain}
.brand b{font-family:var(--f-disp);font-weight:700;font-size:19px;letter-spacing:.02em}
.ws{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--ink-2);background:var(--panel)}
.ws i{width:18px;height:18px;border-radius:6px;background:linear-gradient(135deg,var(--accent-2),#6366f1);display:inline-block}
.nav{gap:1px}
.nav button{padding:7px 10px;border-radius:8px;font-weight:500;font-size:13.5px;color:var(--ink-2);gap:10px}
.nav button svg{width:16px;height:16px;opacity:.85}
.nav button:hover{background:var(--panel-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--nav-on);color:var(--ink)}
.nav .kbd{display:none}
.nav .grp{height:1px;background:var(--line);margin:8px 6px}
.nav .grp-l{font-size:11px;font-weight:600;color:var(--ink-3);padding:8px 10px 4px}
.tracker{background:var(--panel);border-color:var(--line);border-radius:12px;padding:12px}
.tracker .t-time{font-family:var(--f-ui);font-size:26px;font-weight:700;letter-spacing:-.02em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:none;padding:18px}
.panel-h{margin-bottom:12px}
.btn{border-radius:999px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink);font-weight:600;font-size:13px;padding:7px 14px}
.btn:hover{border-color:var(--ink-3);background:var(--panel-3)}
.btn.primary{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
.btn.primary:hover{filter:none;opacity:.88;background:var(--cta)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn.violet{background:#7c3aed;border-color:#7c3aed;color:#fff}   /* 5.7:1 with white text (bug 22) */
.btn.lg{padding:11px 22px;font-size:14.5px}
.icon-btn{border-radius:999px}
.seg{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border-radius:999px;font-weight:600;font-size:12.5px;color:var(--ink-3);padding:5px 12px}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:none}
.chip{background:var(--panel-2);border-color:var(--line);color:var(--ink-2)}

.input,select.input,textarea.input{background:var(--panel-2);border-color:var(--line-2);border-radius:10px}
.input:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
.qa{background:var(--panel);border-color:var(--line-2);box-shadow:none;border-radius:999px;padding:5px 5px 5px 16px}
.tasks{background:var(--panel);border-color:var(--line);box-shadow:none;border-radius:14px}
.group-h{background:transparent;color:var(--ink-3);font-weight:600;font-size:12px;padding:12px 16px 6px}
.task:hover{background:var(--panel-2)}
.check{border-radius:50%}
.check[aria-checked="true"]{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.play{background:var(--panel-2);border-color:var(--line-2)}
.play.on{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.stat .v{font-family:var(--f-ui);font-weight:700;letter-spacing:-.02em}
.stat .l{font-weight:500;color:var(--ink-3);font-size:12.5px}
.score-bar i,.pomodots i.f{background:var(--accent-2)}
.pomodots i.f{border-color:var(--accent-2)}
.tl-track{background:var(--panel-2);border-radius:10px}
.tl-seg{box-shadow:0 0 0 1px var(--panel)}
.tl-now{background:var(--accent)}
.toast{background:var(--panel-3);color:var(--ink);border:1px solid var(--line-2)}
.tip{background:#18181b;color:#fafafa;border:1px solid #2e2e33}
.modal{background:var(--panel);border:1px solid var(--line-2)}
.overlay{background:rgba(0,0,0,.6)}
.banner{background:var(--panel);border-color:var(--line-2)}
.toggle[aria-checked="true"]{background:var(--accent-2)}
.ring .clock{font-family:var(--f-ui);letter-spacing:-.04em}
.sync{font-size:11.5px}

/* Dashboard */
.dash-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.dash-head .dn{display:flex;align-items:center;gap:6px}
.dash-head h1{font-size:22px}
.today-pill{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px;margin-left:6px;vertical-align:middle;font-family:var(--f-ui)}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.rail{display:flex;flex-direction:column;gap:12px}
.rail .panel{padding:16px}
.rail-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink-3);font-weight:600;margin-bottom:10px}
.big{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.big small{font-size:15px;font-weight:600;color:var(--ink-2);letter-spacing:0;margin:0 3px}
.delta{font-size:12px;font-weight:600;margin-top:4px}
.delta.up{color:var(--good-ink)} .delta.down{color:var(--crit-ink)} .delta.flat{color:var(--ink-3)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair>div{min-width:0}
.donut-wrap{display:grid;grid-template-columns:116px 1fr;gap:14px;align-items:center}
.dl{display:flex;flex-direction:column;gap:6px;font-size:12.5px;min-width:0}
.dl div{display:grid;grid-template-columns:10px 1fr auto;gap:7px;align-items:center}
.dl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.dl b{font-weight:600}
.pm-bar{display:flex;gap:2px;height:14px;border-radius:5px;overflow:hidden;background:var(--panel-2)}
.pm-bar i{display:block;height:100%}
.pm-leg{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.pm-leg span{display:flex;align-items:center;gap:6px}
.pm-leg b{margin-left:auto;font-weight:600;color:var(--ink)}

/* Calendar day view */
.cal{padding:0;overflow:hidden}
.cal-cols{display:grid;grid-template-columns:52px repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-3)}
.cal-cols div{padding:10px 10px;display:flex;align-items:center;gap:6px;border-left:1px solid var(--line)}
.cal-cols div:first-child{border-left:0}
.cal-cols svg{width:14px;height:14px}
.cal-scroll{max-height:640px;overflow-y:auto;position:relative;padding:10px 0 12px}
.cal-grid{position:relative;display:grid;grid-template-columns:52px repeat(3,minmax(0,1fr))}
.cal-hours{position:relative}
.cal-hours span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:var(--ink-3)}
.cal-col{position:relative;border-left:1px solid var(--line);z-index:1}
.cal-col.addable{cursor:copy}
.cal-line{position:absolute;left:52px;right:0;border-top:1px solid var(--line);pointer-events:none;z-index:0}
.cal-line.half{border-top-style:dashed;opacity:.55}
.cb{position:absolute;left:4px;right:4px;border-radius:6px;padding:4px 7px;font-size:11.5px;line-height:1.3;overflow:hidden;border:0;text-align:left;font-family:inherit;cursor:pointer;display:block}
.cb b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb small{display:block;opacity:.85;font-size:11px}
.cb .du{position:absolute;right:5px;bottom:3px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.22);border-radius:4px;padding:0 4px}
.cb.thin{padding:0}
.cb:hover{filter:brightness(1.08)}
.cb.plan{background:transparent!important;border:1.5px dashed var(--accent-2);color:var(--ink)}
.cb.plan .du{background:var(--accent-soft)}
.cal-now{position:absolute;left:52px;right:0;height:2px;background:var(--accent);pointer-events:none;z-index:3}
.cal-now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.done-pin{position:absolute;left:4px;right:4px;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line-2);border-radius:999px;padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translateY(-50%);z-index:2}
.done-pin svg{width:11px;height:11px;color:var(--good-ink);flex:none}

/* Tracker controls */
.trk{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--panel)}
.trk-h{display:flex;align-items:center;gap:8px;font-size:13px}
.trk-h b{font-weight:600}
.trk-s{font-size:12px;color:var(--ink-3);margin:2px 0 8px 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.trk.on .pulse{background:var(--good);box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:pulse 2s infinite}
.trk.paused .pulse{background:var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.5)}70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.trk .row{display:flex;gap:6px;flex-wrap:wrap}
.trk-menu{display:flex;flex-direction:column;gap:2px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.trk-menu button{background:none;border:0;text-align:left;padding:6px 8px;border-radius:7px;font-size:13px;color:var(--ink-2)}
.trk-menu button:hover{background:var(--panel-2);color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:4px 0 12px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-weight:600}

@media (max-width:1180px){.dash{grid-template-columns:1fr}.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}}
@media (max-width:860px){

  .cb small{display:none}
  .rail{display:flex}
}

/* Planner */
.plan-panel{margin-bottom:16px;border-color:color-mix(in srgb,var(--accent-2) 35%,var(--line))}
.plan-panel h2{display:flex;align-items:center;gap:8px}
.plan-panel h2 svg{width:16px;height:16px;color:var(--accent)}
.plan-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
.ebars{display:flex;align-items:flex-end;gap:3px;height:50px}

.pl-n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;flex:none}
.pl-why{color:var(--ink-3)}
.effort{border:1px solid var(--line-2);background:var(--panel-2);border-radius:999px;font-size:11.5px;font-weight:600;padding:1px 8px;color:var(--ink-2);cursor:pointer}
.effort.e-H{border-color:color-mix(in srgb,var(--crit) 50%,var(--line-2));color:var(--crit-ink)}
.effort.e-M{border-color:color-mix(in srgb,var(--warn) 50%,var(--line-2))}
.effort.e-L{border-color:color-mix(in srgb,var(--good) 45%,var(--line-2));color:var(--good-ink)}
.t-actions .icon-btn{width:28px;height:28px;font-size:11px}
@media (max-width:860px){.pl-row{grid-template-columns:48px minmax(0,1fr)}.pl-row .t-actions{grid-column:2}.plan-grid{grid-template-columns:1fr}}

/* Keel date & time pickers (replace the browser's default pickers) */
.dp{display:inline-flex;position:relative}
.dp-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13.5px;white-space:nowrap;min-height:36px}

.pop{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 24px 60px -12px rgba(0,0,0,.55);padding:12px;width:292px;animation:popin .12s ease-out}

.cal-days button.today{box-shadow:inset 0 0 0 1.5px var(--accent-2);color:var(--accent);font-weight:700}
.cal-days button[aria-selected="true"]{background:var(--accent-2);color:#fff;font-weight:700;box-shadow:none}

.pop-f{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.pop-f .btn{flex:1;padding:5px 8px;font-size:12.5px}
.tp{width:220px}
.tp input{width:100%;margin-bottom:8px}
.tp-list{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;padding-right:2px}
.tp-list button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.tp-list button:hover{background:var(--panel-3)}
.tp-list button[aria-selected="true"]{background:var(--accent-2);color:#fff;font-weight:700}

/* ---------------- Quick-add parser ---------------- */
const WD = ["sun","mon","tue","wed","thu","fri","sat"];
function parseQuick(input) {
  // #project and !priority work anywhere. Dates and durations are only read from the end of the text
  // (after the last ordinary word), so titles like "Friday review" or "Call the Friday supplier" keep their words.
  const out = { title: "", projectId: null, priority: 0, due: null, estimate: 0 };
  const DAYS = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
  const classify = tok => {
    let m;
    if ((m = tok.match(/^#(.+)$/))) {
      const q = slug(m[1]);
      const p = state.projects.find(p => slug(p.name) === q) || state.projects.find(p => q && slug(p.name).startsWith(q));
      if (p) return { kind: "project", apply: () => { out.projectId = p.id; } };
    }
    if ((m = tok.match(/^!(1|2|3|high|hi|h|medium|med|m|low|lo|l)$/i))) {
      const v = m[1].toLowerCase();
      return { kind: "priority", apply: () => { out.priority = ["1","high","hi","h"].includes(v) ? 3 : ["2","medium","med","m"].includes(v) ? 2 : 1; } };
    }
    const low = tok.toLowerCase();
    if (low === "today" || low === "tod") return { kind: "date", apply: () => { out.due = todayKey(); } };
    if (low === "tomorrow" || low === "tmr" || low === "tom") return { kind: "date", apply: () => { out.due = addDays(todayKey(), 1); } };
    if (low === "nextweek") return { kind: "date", apply: () => { out.due = addDays(todayKey(), 7); } };
    const wi = WD.findIndex(w => low === w || (low.length > 3 && w === low.slice(0, 3) && DAYS.includes(low)));
    if (wi >= 0) return { kind: "date", apply: () => { const cur = new Date().getDay(); out.due = addDays(todayKey(), ((wi - cur + 7) % 7) || 7); } };
    if (/^\d{4}-\d{2}-\d{2}$/.test(tok)) return { kind: "date", apply: () => { out.due = tok; } };
    if ((m = tok.match(/^(?:(\d+(?:\.\d+)?)h)?(?:(\d+)m(?:in)?)?$/i)) && (m[1] || m[2])) return { kind: "estimate", apply: () => { out.estimate = Math.round((parseFloat(m[1] || 0) * 60) + parseInt(m[2] || 0)); } };
    return { kind: "word" };
  };
  const toks = input.trim().split(/\s+/).filter(Boolean).map(tok => ({ tok, ...classify(tok) }));
  let lastWord = -1;
  toks.forEach((t, i) => { if (t.kind === "word") lastWord = i; });
  const keep = [];
  toks.forEach((t, i) => {
    if (t.kind === "project" || t.kind === "priority" || ((t.kind === "date" || t.kind === "estimate") && i > lastWord)) t.apply();
    else keep.push(t.tok);
  });
  out.title = keep.join(" ");
  return out;
}

function plannerCard(k) {

function insightFor(t) {

/* ----- Tasks ----- */
const taskSort = (a, b) => (b.priority || 0) - (a.priority || 0) || ((a.due || "9999") < (b.due || "9999") ? -1 : (a.due || "9999") > (b.due || "9999") ? 1 : 0) || (a.createdAt - b.createdAt);

function viewTasks() {

  const counts = {
    today: list.filter(t => !t.done && t.due && t.due <= k).length,
    upcoming: list.filter(t => !t.done && t.due && t.due > k).length,
    open: list.filter(t => !t.done).length,
    done: list.filter(t => t.done).length
  };
  const spent = taskSpent();
  let body = "";
  if (f === "today") {
    const over = list.filter(t => !t.done && t.due && t.due < k).sort(taskSort);
    const tod = list.filter(t => !t.done && t.due === k).sort(taskSort);
    const doneT = list.filter(t => t.done && t.doneAt && dayKey(t.doneAt) === k);
    body = (over.length ? `<div class="group-h">Overdue</div>${over.map(t => taskRow(t, spent)).join("")}` : "") +

    let last = null;

  } else if (f === "open") {
    const noDate = list.filter(t => !t.done && !t.due).sort(taskSort);
    const dated = list.filter(t => !t.done && t.due).sort((a, b) => a.due < b.due ? -1 : a.due > b.due ? 1 : taskSort(a, b));

    <div class="chips"><button class="chip" aria-pressed="${pf === "all"}" data-act="task-proj" data-p="all">All projects</button>${state.projects.map(p => `<button class="chip" aria-pressed="${pf === p.id}" data-act="task-proj" data-p="${esc(p.id)}"><i class="dot" style="background:${slotColor(p.slot)}"></i>${esc(p.name)}</button>`).join("")}</div>

/* ----- Focus ----- */

            : `<button class="btn lg primary" data-act="focus-start">${ICON.play} ${mode === "break" ? `Start ${dur}-min break` : mode === "pomodoro" ? `Start ${dur}-min focus` : "Start stopwatch"}</button>`}
      </div>
      ${mode !== "open" ? `<div class="pomodots" aria-label="${count} pomodoros today">${Array.from({ length: s.longEvery }, (_, i) => `<i class="${i < cyc || (cyc === 0 && count > 0) ? "f" : ""}"></i>`).join("")}<span style="margin-left:6px">${count} today · long break every ${s.longEvery}</span></div>` : ""}

    </div>

}

/* ----- Timeline ----- */
function viewTimeline() {
  const k = ui.tlDay || todayKey(), st = dayStats(k);

      <button class="btn primary" data-act="add-entry">${ICON.plus} Add time</button></div></div>
  <section class="panel" style="margin-bottom:18px"><div class="panel-h"><h2>${fmtDay(k, true)}</h2><span class="muted num">${fmtDur(st.work)} worked · ${fmtDur(st.focus)} focus · ${fmtDur(st.brk)} breaks</span></div>${dayTimeline(k, st)}</section>
  <section class="panel"><div class="panel-h"><h2>Entries</h2></div>
    ${rows.length ? `<div class="session-list entries">${rows.map(e => {
      const t = e.taskId && taskById(e.taskId);
      return `<div class="srow"><i class="bar ${e.type === "break" ? "hatch" : ""}" style="background:${e.type === "break" ? "" : projColor(e.projectId)}"></i>
        <span class="time num">${fmtTime(e.start)} – ${e.live ? "now" : fmtTime(e.end)}</span>
        <div class="w"><div><b>${esc(t ? t.title : e.type === "break" ? "Break" : projName(e.projectId))}</b></div><small>${TYPE_LABEL[e.type]}${e.type !== "break" ? " · " + esc(projName(e.projectId)) : ""}${e.switches ? ` · ${e.switches} tab switch${e.switches === 1 ? "" : "es"}` : ""}${e.note ? " · " + esc(e.note) : ""}${e.live ? " · running" : ""}</small></div>
        <span class="d num" ${e.live ? 'data-live="clock-el"' : ""}>${fmtDur(e.dur)}</span>
        <span>${e.live ? "" : `<button class="icon-btn" data-act="edit-entry" data-id="${esc(e.id)}" aria-label="Edit entry">${ICON.edit}</button><button class="icon-btn" data-act="del-entry" data-id="${esc(e.id)}" aria-label="Delete entry">${ICON.trash}</button>`}</span></div>`;
    }).join("")}</div>` : `<div class="empty"><h3>No entries on this day</h3>Forgot to start the timer? Use <b>Add time</b> to log it by hand.</div>`}

}
function entryModal(e) {
  const isNew = !e || !e.id;

  const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  openModal(`<h2>${isNew ? "Log time" : "Edit entry"}</h2><p>${isNew ? "Add time you worked away from the timer." : "Adjust when this happened or what it was for."}</p>
    <form class="form" data-form="entry" data-id="${isNew ? "" : esc(e.id)}">
      <label class="field">Type<select class="input" name="type">${Object.entries(TYPE_LABEL).map(([v, l]) => `<option value="${v}" ${e.type === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <div class="field">Date${dateField({ key: "entry-date", value: dayKey(e.start), attrs: `name="date"`, label: "Date" })}</div>

      <div class="field">End${timeField({ key: "entry-end", value: hm(e.end), attrs: `name="end"`, label: "End time" })}</div>

      <label class="field">Task<select class="input" name="taskId"><option value="">No task</option>${state.tasks.filter(t => !t.done || t.id === e.taskId).map(t => `<option value="${esc(t.id)}" ${t.id === e.taskId ? "selected" : ""}>${esc(t.title)}</option>`).join("")}</select></label>
      <label class="field wide">Note<input class="input" name="note" value="${esc(e.note || "")}" placeholder="Optional"></label>
      <p class="wide muted" id="entry-err" style="margin:0;color:var(--crit-ink)"></p>
      <div class="acts wide"><button type="button" class="btn" data-act="modal-close">Cancel</button><button class="btn primary">${isNew ? "Log time" : "Save changes"}</button></div>
    </form>`);
}

/* ----- Reports ----- */
function rangeDays() {
  const t = todayKey(), r = ui.reportRange, ws = state.settings.weekStart;
  const dow = keyToDate(t).getDay();
  const back = (dow - ws + 7) % 7;
  let start, n;
  if (r === "week") { start = addDays(t, -back); n = 7; }
  else if (r === "lastweek") { start = addDays(t, -back - 7); n = 7; }
  else if (r === "14d") { start = addDays(t, -13); n = 14; }
  else { start = addDays(t, -29); n = 30; }
  return Array.from({ length: n }, (_, i) => addDays(start, i));
}
function viewReports() {
  const days = rangeDays();
  const stats = days.map(k => ({ k, ...dayStats(k) }));
  const totals = { work: 0, focus: 0, brk: 0, sessions: 0 }; const byProj = {}; let scoreSum = 0, scoreN = 0;
  for (const s of stats) { totals.work += s.work; totals.focus += s.focus; totals.brk += s.brk; totals.sessions += s.sessions; for (const p in s.byProj) byProj[p] = (byProj[p] || 0) + s.byProj[p]; if (s.score != null) { scoreSum += s.score; scoreN++; } }
  const from = dayStart(days[0]), to = dayStart(days[days.length - 1]) + DAY;
  const doneCount = state.tasks.filter(t => t.done && t.doneAt >= from && t.doneAt < to).length;
  const projOrder = Object.entries(byProj).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const maxDay = Math.max(...stats.map(s => s.work), HOUR);
  const step = maxDay > 8 * HOUR ? 2 * HOUR : maxDay > 4 * HOUR ? HOUR : maxDay > 90 * MIN ? 30 * MIN : 15 * MIN;
  const top = Math.ceil(maxDay / step) * step;
  let grid = "";
  for (let v = 0; v <= top; v += step) grid += `<div class="gridl" style="bottom:${v / top * 100}%"><span class="num">${v ? fmtDur(v) : "0"}</span></div>`;
  const cols = stats.map(s => {
    const segs = projOrder.filter(p => s.byProj[p]).map(p => {
      const nm = p === "_none" ? "No project" : projName(p);
      const tip = `<b>${esc(nm)}</b><br>${fmtDay(s.k, true)}<br>${fmtDur(s.byProj[p])} of ${fmtDur(s.work)}`;
      return `<i style="height:calc(${s.byProj[p] / top * 100}% - 2px);background:${p === "_none" ? "var(--unassigned)" : projColor(p)}" data-tip="${esc(tip)}"></i>`;
    }).join("");
    return `<div class="col" aria-label="${fmtDay(s.k)}: ${fmtDur(s.work)}">${segs}</div>`;
  }).join("");
  const xl = stats.map((s, i) => { const d = keyToDate(s.k); const show = days.length <= 14 || i % 3 === 0; return `<span>${show ? (days.length <= 7 ? `${DOW[d.getDay()]} ${d.getDate()}` : `${d.getDate()}/${d.getMonth() + 1}`) : ""}</span>`; }).join("");
  const legend = projOrder.map(p => `<span><i class="dot" style="background:${p === "_none" ? "var(--unassigned)" : projColor(p)}"></i>${esc(p === "_none" ? "No project" : projName(p))}</span>`).join("");
  const tasksByTime = Object.entries(allEntries().filter(e => e.taskId && e.type !== "break").reduce((m, e) => { const d = clipDur(e, from, to); if (d) m[e.taskId] = (m[e.taskId] || 0) + d; return m; }, {})).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const workDays = stats.filter(s => s.work > 0).length;
  const anyAct = days.some(d => act[d] && act[d].length);
  return `
  <div class="head"><div><h1>Reports</h1><p>${fmtDay(days[0], true)} to ${fmtDay(days[days.length - 1], true)}</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><div class="seg" role="group" aria-label="Date range">${[["week","This week"],["lastweek","Last week"],["14d","14 days"],["30d","30 days"]].map(([id, l]) => `<button aria-pressed="${ui.reportRange === id}" data-act="range" data-r="${id}">${l}</button>`).join("")}</div>
    <button class="btn" data-act="copy-csv">Copy CSV</button></div></div>
  <section class="panel" style="margin-bottom:18px"><div class="kpis">
    <div class="stat"><div class="l">Total worked</div><div class="v num">${fmtDur(totals.work)}</div><div class="s">${workDays} active day${workDays === 1 ? "" : "s"} · avg ${fmtDur(workDays ? totals.work / workDays : 0)}</div></div>
    <div class="stat"><div class="l">Focus time</div><div class="v num">${fmtDur(totals.focus)}</div><div class="s">${totals.work ? Math.round(totals.focus / totals.work * 100) : 0}% of work time</div></div>
    <div class="stat"><div class="l">Avg focus score</div><div class="v num">${scoreN ? Math.round(scoreSum / scoreN) : "—"}</div><div class="s">${totals.sessions} sessions</div></div>
    <div class="stat"><div class="l">Tasks completed</div><div class="v num">${doneCount}</div><div class="s">${fmtDur(totals.brk)} in breaks</div></div>
  </div></section>
  <section class="panel" style="margin-bottom:18px"><div class="panel-h"><h2>Hours per day by project</h2></div>
    ${totals.work ? `<div class="legend" style="margin:0 0 14px">${legend}</div><div class="cols">${grid}${cols}</div><div class="xlab">${xl}</div>` : `<div class="empty"><h3>No tracked time in this range</h3>Start a focus session or log time to see your week take shape.</div>`}
  </section>
  <div class="grid g-today">
    <section class="panel"><div class="panel-h"><h2>Daily breakdown</h2></div>
      <table class="tbl"><thead><tr><th>Day</th><th class="r">Worked</th><th class="r">Focus</th><th class="r">Breaks</th>${anyAct ? `<th class="r">On computer</th><th class="r">Productive</th>` : ""}<th class="r">Score</th></tr></thead>
      <tbody>${stats.slice().reverse().filter(s => s.work || s.brk || (act[s.k] && act[s.k].length) || days.length <= 7).map(s => `<tr><td>${fmtDay(s.k)}</td><td class="r num">${fmtDur(s.work, { zero: "—" })}</td><td class="r num">${fmtDur(s.focus, { zero: "—" })}</td><td class="r num">${fmtDur(s.brk, { zero: "—" })}</td>${anyAct ? (() => { const a = act[s.k] ? actStats(s.k) : null; return `<td class="r num">${a && a.total ? fmtDur(a.total) : "—"}</td><td class="r num">${a && a.total ? Math.round(a.prod / a.total * 100) + "%" : "—"}</td>`; })() : ""}<td class="r num">${s.score ?? "—"}</td></tr>`).join("")}</tbody></table></section>
    <div class="stack">
      <section class="panel"><div class="panel-h"><h2>By project</h2></div>${projBars(byProj)}</section>
      <section class="panel"><div class="panel-h"><h2>Most time on tasks</h2></div>${tasksByTime.length ? `<table class="tbl"><tbody>${tasksByTime.map(([id, ms]) => { const t = taskById(id); return `<tr><td>${esc(t ? t.title : "Deleted task")}</td><td class="r num">${fmtDur(ms)}</td></tr>`; }).join("")}</tbody></table>` : `<p class="muted" style="margin:0">Press play on a task to attribute time to it.</p>`}</section>
    </div>
  </div>`;
}

/* ----- Apps (computer activity) ----- */
function catBars(byCat) {
  const rows = CAT_ORDER.filter(c => byCat[c]).sort((a, b) => byCat[b] - byCat[a]);
  if (!rows.length) return `<p class="muted" style="margin:0">No activity recorded.</p>`;
  const max = byCat[rows[0]];
  return `<div class="hbars">${rows.map(c => `<div class="hbar wide-n"><div class="n"><i class="dot" style="background:${catColor(c)}"></i><span>${CATS[c].label}<small>${PROD_LABEL[CATS[c].prod]}</small></span></div><div class="b"><i style="width:${byCat[c] / max * 100}%;background:${catColor(c)}"></i></div><div class="v num">${fmtDur(byCat[c])}</div></div>`).join("")}</div>`;
}
function actSummaryPanel(k) {
  const a = actStats(k);
  if (!a.total) return "";
  const top = a.items.slice(0, 5), max = top[0].ms;
  return `<section class="panel"><div class="panel-h"><h2>Computer activity</h2><button class="btn sm ghost" data-act="nav" data-view="apps">Details</button></div>
    <div class="stats mini" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
      <div class="stat"><div class="l">On computer</div><div class="v num">${fmtDur(a.total)}</div></div>
      <div class="stat"><div class="l">Productive</div><div class="v num">${Math.round(a.prod / a.total * 100)}%</div></div>
      <div class="stat"><div class="l">Distracting</div><div class="v num">${fmtDur(a.dist)}</div></div></div>
    <div class="hbars">${top.map(it => { const c = catOf(it.key); return `<div class="hbar"><div class="n"><i class="dot" style="background:${catColor(c)}"></i>${esc(it.domain || it.app)}</div><div class="b"><i style="width:${it.ms / max * 100}%;background:${catColor(c)}"></i></div><div class="v num">${fmtDur(it.ms)}</div></div>`; }).join("")}</div></section>`;
}
function setupPanel() {
  return `<section class="panel setup">
    <h2 style="margin-bottom:8px">${TR.state === "online" ? "Connected — waiting for activity" : "Connect the tracker on your Mac"}</h2>
    <p class="muted" style="margin:0 0 16px">A web page can't see your other apps, so a small tracker on your Mac records them and Keel reads its file.</p>
    <ol class="steps">
      <li><b>Keep the tracker running.</b> It starts at login and saves to <code>Keel Activity/keel-activity.json</code> in your home folder every 30 seconds.</li>
      <li><b>Open Keel from your own site</b> (your GitHub Pages address). Keel connects to the tracker by itself, shows whether it's running, and loads your activity every minute. Pause and resume it from the sidebar.</li>
      <li><b>Or import the file.</b> Click <b>Import activity file</b>, press <kbd>⌘</kbd><kbd>⇧</kbd><kbd>H</kbd> to jump to your home folder, open <b>Keel Activity</b> and choose <b>keel-activity.json</b>. You can also drag the file onto this page.</li>
      <li><b>Refresh whenever you like.</b> Where your browser allows it, Keel remembers the file and picks up new activity automatically while this page is open.</li>
    </ol>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="btn primary" data-act="act-import">Import activity file</button></div>
    <p class="muted" style="margin:18px 0 0;font-size:13px">The tracker records the name of the app in front and, for browsers, the site and tab title. It doesn't take screenshots or log keystrokes, and it only writes a file on your Mac. Time stops counting after 3 minutes without keyboard or mouse input.</p>
  </section>`;
}
function viewApps() {
  const has = Object.keys(act).length > 0;
  const k = ui.actDay || todayKey();
  const head = `<div class="head"><div><h1>Apps & sites</h1><p>Where your computer time went, recorded by the Keel tracker on your Mac.</p></div>
    <div class="daynav">${has ? `<button class="icon-btn" data-act="act-day" data-d="-1" aria-label="Previous day">${ICON.left}</button>
      ${dateField({ key: "act-day", value: k, attrs: `data-change="act-date"`, label: "Day shown", compact: true })}
      <button class="icon-btn" data-act="act-day" data-d="1" aria-label="Next day">${ICON.right}</button>
      ${k !== todayKey() ? `<button class="btn sm" data-act="act-today">Today</button>` : ""}` : ""}
      ${has ? (TR.state === "online" ? `<button class="btn primary" data-act="tr-refresh">Refresh</button>` : `<button class="btn primary" data-act="act-refresh">${FSH.handle ? "Refresh" : "Import activity file"}</button>`) : ""}</div></div>`;
  if (!has) return head + `<div class="grid g-today">${setupPanel()}<div class="stack">${trackerPanel()}</div></div>`;
  const a = actStats(k);
  const lim = ui.actAll ? 200 : 15;
  const rows = a.items.slice(0, lim).map(it => {
    const key = it.key, c = catOf(key), r = state.appRules[key] || {}, tt = topTitle(it);
    const sub = it.domain ? `${esc(it.app)}${tt ? " · " + esc(tt) : ""}` : esc(tt);
    return `<tr><td><div class="an"><i class="dot" style="background:${catColor(c)}"></i><div><b>${esc(it.domain || it.app)}</b>${sub ? `<small>${sub}</small>` : ""}</div></div></td>
      <td><select class="input sm-sel" data-change="act-cat" data-key="${esc(key)}" aria-label="Category for ${esc(it.domain || it.app)}">${CAT_ORDER.map(cc => `<option value="${cc}" ${cc === c ? "selected" : ""}>${CATS[cc].label}</option>`).join("")}</select></td>
      <td class="hide-m"><select class="input sm-sel" data-change="act-proj" data-key="${esc(key)}" aria-label="Project for ${esc(it.domain || it.app)}">${projOptions(r.projectId || "", "No project")}</select></td>
      <td class="r num">${fmtDur(it.ms)}<small>${Math.round(it.ms / a.total * 100)}%</small></td></tr>`;
  }).join("");
  const hours = a.total / HOUR;
  return head + `
  ${a.total ? `<section class="panel" style="margin-bottom:18px"><div class="kpis five">
    <div class="stat"><div class="l">On computer</div><div class="v num">${fmtDur(a.total)}</div><div class="s">${fmtTime(a.first)} – ${fmtTime(a.last)}</div></div>
    <div class="stat"><div class="l">Productive</div><div class="v num">${fmtDur(a.prod)}</div><div class="s">${Math.round(a.prod / a.total * 100)}% of computer time</div></div>
    <div class="stat"><div class="l">Distracting</div><div class="v num">${fmtDur(a.dist)}</div><div class="s">${Math.round(a.dist / a.total * 100)}% of computer time</div></div>
    <div class="stat"><div class="l">App switches</div><div class="v num">${a.switches}</div><div class="s">${hours >= 0.25 ? Math.round(a.switches / hours) + " per hour" : "—"}</div></div>
    <div class="stat"><div class="l">Most used</div><div class="v" style="font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.items[0].domain || a.items[0].app)}</div><div class="s">${fmtDur(a.items[0].ms)}</div></div>
  </div></section>
  <section class="panel" style="margin-bottom:18px"><div class="panel-h"><h2>${fmtDay(k, true)}</h2></div>${dayTimeline(k, dayStats(k), { appsOnly: true })}</section>
  <div class="grid g-today">
    <section class="panel"><div class="panel-h"><h2>Apps & sites</h2><span class="muted" style="font-size:13px">Change a category or project and Keel remembers it</span></div>
      <div style="overflow-x:auto"><table class="tbl apps-tbl"><thead><tr><th>Name</th><th>Category</th><th class="hide-m">Project</th><th class="r">Time</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${a.items.length > 15 ? `<div style="text-align:center;margin-top:10px"><button class="btn sm ghost" data-act="act-more">${ui.actAll ? "Show fewer" : `Show all ${a.items.length}`}</button></div>` : ""}
      ${(() => { const n = Object.keys(state.appRules).length; return n ? `<div style="margin-top:12px;display:flex;justify-content:flex-end"><button class="btn sm ghost" data-act="act-reset-rules">Reset ${n} custom rule${n === 1 ? "" : "s"}</button></div>` : ""; })()}</section>
    <div class="stack">
      <section class="panel"><div class="panel-h"><h2>By category</h2></div>${catBars(a.byCat)}</section>
      ${Object.keys(a.byProj).length ? `<section class="panel"><div class="panel-h"><h2>By project</h2></div>${projBars(a.byProj)}</section>` : ""}
      ${trackerPanel()}
    </div>
  </div>` : `<section class="panel"><div class="empty"><h3>No computer activity on this day</h3>The tracker only records while your Mac is awake and in use. Pick another day, or refresh to load the latest file.</div></section>`}`;
}

/* ----- Projects ----- */
function viewProjects() {
  const all = allEntries();
  const wk = (() => { const t = todayKey(); const back = (keyToDate(t).getDay() - state.settings.weekStart + 7) % 7; return dayStart(addDays(t, -back)); })();
  const rows = state.projects.map(p => {
    let total = 0, week = 0;
    for (const e of all) if (e.projectId === p.id && e.type !== "break") { total += e.dur; week += clipDur(e, wk, wk + 7 * DAY); }
    const openT = state.tasks.filter(t => t.projectId === p.id && !t.done).length;
    return `<div class="prow">
      <button class="colorbtn" style="background:${slotColor(p.slot)}" data-act="pick-color" data-id="${esc(p.id)}" aria-label="Change color of ${esc(p.name)}"></button>
      <input class="input" id="pn-${p.id}" value="${esc(p.name)}" data-change="proj-name" data-id="${esc(p.id)}" aria-label="Project name">
      <div class="hide-m"><div class="muted" style="font-size:12px">This week</div><b class="num">${fmtDur(week)}</b></div>
      <div class="hide-m"><div class="muted" style="font-size:12px">All time</div><b class="num">${fmtDur(total)}</b></div>
      <div class="hide-m"><div class="muted" style="font-size:12px">Open tasks</div><b class="num">${openT}</b></div>
      <button class="icon-btn" data-act="del-proj" data-id="${esc(p.id)}" aria-label="Delete ${esc(p.name)}">${ICON.trash}</button>
    </div>${ui.colorFor === p.id ? `<div style="padding:0 16px 14px 56px"><div class="swatches">${PAL_L.map((_, i) => `<button class="sw" style="background:${slotColor(i)}" aria-pressed="${p.slot === i}" data-act="set-color" data-id="${esc(p.id)}" data-slot="${i}" aria-label="Color ${i + 1}"></button>`).join("")}</div></div>` : ""}`;
  }).join("");
  return `
  <div class="head"><div><h1>Projects</h1><p>Group tasks and tracked time. Colors carry through every chart.</p></div></div>
  <form class="qa" data-form="add-proj" style="margin-bottom:18px"><input id="proj-new" name="n" placeholder="New project name" aria-label="New project name" autocomplete="off"><button class="btn primary">Add project</button></form>
  <section class="tasks">${rows || `<div class="empty"><h3>No projects</h3>Add one above to start grouping your time.</div>`}</section>
  ${state.projects.length > 8 ? `<p class="muted">Projects past the eighth reuse colors; keep your active list short so charts stay readable.</p>` : ""}`;
}

/* ----- Settings ----- */
function viewSettings() {

/* ---------------- Date & time pickers ---------------- */
// A field is a trigger button plus a hidden input that carries the value (YYYY-MM-DD or HH:MM). Picking a value

const PICK = { el: null, key: null, kind: null, month: null };

}

}
const pickInput = key => document.querySelector(`[data-dp="${CSS.escape(key)}"] input[type="hidden"]`);

  const lead = (first.getDay() - ws + 7) % 7, start = new Date(y, m - 1, 1 - lead), today = todayKey();
  const names = Array.from({ length: 7 }, (_, i) => DOW[(ws + i) % 7].slice(0, 2));

/* ---------------- Modal / toast / tooltip ---------------- */
let lastFocus = null;

  const f = $("#modal-root .modal input, #modal-root .modal textarea, #modal-root .modal .primary, #modal-root .modal button");

}
function closeModal() { $("#modal-root").innerHTML = ""; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
function confirmModal(title, text, label, onYes) {

  openModal(`<h2>${title}</h2><p>${text}</p><div class="acts"><button class="btn" data-act="modal-close">Cancel</button><button class="btn primary" data-act="confirm-yes" style="background:var(--crit);border-color:var(--crit);color:#fff">${label}</button></div>`);
}
let pendingConfirm = null;
function toast(msg) {

document.addEventListener("pointerover", e => { const t = e.target.closest("[data-tip]"); if (!t) return; tip.innerHTML = t.dataset.tip; tip.classList.add("on"); });

  if (now - (state.lastCleanup || 0) > DAY) cleanupKeel(false);
  const editing = document.activeElement && ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
  if (todayKey() !== lastDay) { lastDay = todayKey(); if (ui.tlDay === addDays(lastDay, -1)) ui.tlDay = lastDay; bgRender(); }
  else if (now - lastFull > 30000 && !editing && !$("#modal-root").innerHTML && !PICK.el && ["today", "timeline", "reports", "apps"].includes(ui.view)) { lastFull = now; bgRender(); }
}

/* ---------------- Boot ---------------- */
applyTheme();
// Resolve a pomodoro that finished while the page was closed.
if (state.active && state.active.mode === "pomodoro" && !state.active.pausedAt && activeElapsed() >= state.active.plannedMs) {
  const a = state.active; finishSession({ completed: true, silent: true, endAt: a.start + a.plannedMs + a.pausedTotal });
}
// The tracker is only contacted once it has connected before (or when the user presses Check again), so
// visitors without it don't get a failed request and console error on every page (bug 25).
if (!ui.trSeen) TR.state = "off";
render();
setInterval(tick, 1000);
document.addEventListener("pointerdown", unlockAudio, { once: true });
Sync.init();
if (ui.trSeen) trPoll(true);
if ("serviceWorker" in navigator && !IN_CLAUDE && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) { try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch { /* best effort: safe to ignore */ } }
idbGet().then(h => { if (h) { FSH.handle = h; refreshActivity(true).then(() => { if (ui.view === "apps") bgRender(); }); } });
(async () => {
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    const s = await window.claude.use("sample");
    if (s) { aiAvailable = true; const p = $("#ai-panel"); if (p) p.hidden = false; }
  } catch { /* best effort: safe to ignore */ }
})();
</script>
